name: flutter_w
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.10.0
  firebase_auth: ^4.4.0
  cloud_firestore: ^4.7.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  math_expressions: ^2.4.0
  provider: ^6.1.2
  
  dio: ^5.4.0
  get: ^4.6.1
  
  # iOS-style icons
  cupertino_icons: ^1.0.8

  # For HTTP requests
  http: ^1.5.0

  # For using Google Fonts easily
  google_fonts: ^6.3.2

  # For reading/writing local files & directories
  path_provider: ^2.1.5

  # For JSON encoding/decoding, hashing, etc.
  crypto: ^3.0.7

  # For smooth async operations
  async: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  # Recommended lint rules for better code
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
